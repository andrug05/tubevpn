name: Build RideTube MGU Store catalog

on:
  push:
    branches:
      - feature/vless-xray-ridetube
      - releases
    paths:
      - 'apps/**'
      - 'kit/**'
      - 'native/jap-ridetube-d/**'
      - 'native/ytdec/**'
      - 'native/mgu-render-id7-touch/**'
      - 'tools/release.py'
      - 'mgu-repo.json'
      - '.github/workflows/build-mgu-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ridetube-mgu-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout RideTube
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Checkout MGU Store packer
        uses: actions/checkout@v5
        with:
          repository: robertnisipeanu/mgu-store
          path: mgu-store

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ffmpeg file curl

      - name: Build RideTube OAP release package
        run: |
          set -euo pipefail
          python3 kit/tools/build.py jap_ridetube
          python3 - <<'PY'
          import importlib.util, json, pathlib, time
          spec = json.loads(pathlib.Path('apps/jap_ridetube/app.json').read_text())
          version = spec['version']
          src = pathlib.Path('dist') / f"jap_ridetube@{version}.tgz"
          assert src.is_file(), f"app build did not produce {src}"
          modspec = importlib.util.spec_from_file_location('release', 'tools/release.py')
          mod = importlib.util.module_from_spec(modspec)
          modspec.loader.exec_module(mod)
          out = pathlib.Path('dist') / 'release-app'
          out.mkdir(parents=True, exist_ok=True)
          dst = out / src.name
          mod.strip_sdk(str(src), str(dst), int(time.time()))
          print(f"Prepared release package: {dst} ({dst.stat().st_size} bytes)")
          PY

      - name: Publish RideTube app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json; print(json.load(open('apps/jap_ridetube/app.json'))['version'])")"
          TAG="jap_ridetube-v${VERSION}"
          gh release delete "${TAG}" --yes --cleanup-tag || true
          gh release create "${TAG}" "dist/release-app/jap_ridetube@${VERSION}.tgz" \
            --target "$GITHUB_SHA" \
            --title "RideTube ${VERSION}" \
            --notes "RideTube OAP package for BMW MGU ID7. Install from the GitHub Releases source in MGU Store. Requires the RideTube service tool from the catalog release."

      - name: Build BMW ytdec target binary
        working-directory: native/ytdec
        run: |
          make test
          make target PYTHON=python3.12

      - name: Build RideTube service tool
        working-directory: native/jap-ridetube-d
        env:
          MGU_STORE: ${{ github.workspace }}/mgu-store
          PYTHON: python3.12
        run: |
          chmod +x build.sh tools/*.sh check.sh
          sh -x ./build.sh ../ytdec/build/target/ytdec

      - name: Fetch required published MGU runtime artifacts
        run: |
          set -euo pipefail
          mkdir -p dist native/mgu-render-id7-touch/dist
          curl -fL --retry 3 'https://github.com/JustAnotherPU/ridetube/releases/download/catalog/mgu-render-id7-touch%401.4.0.tgz' -o 'native/mgu-render-id7-touch/dist/mgu-render-id7-touch@1.4.0.tgz'
          curl -fL --retry 3 'https://github.com/JustAnotherPU/mgu-apps/releases/download/catalog/jap-node22%4022.23.4.tgz' -o 'dist/jap-node22@22.23.4.tgz'

      - name: Assemble complete MGU Store catalog
        run: |
          python3 tools/release.py \
            --node22 dist/jap-node22@22.23.4.tgz \
            --base 'https://github.com/andrug05/tubevpn/releases/download/catalog/'

      - name: Validate catalog and artifacts
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('dist/release')
          catalog = json.loads((root / 'catalog.json').read_text())
          components = {c['id']: c for c in catalog['components']}
          required = {'jap-ridetube-d', 'jap-node22', 'mgu-render-id7-touch'}
          missing = required - components.keys()
          assert not missing, f'missing catalog components: {sorted(missing)}'
          for component in components.values():
              artifact = component.get('artifact')
              if artifact:
                  p = root / artifact['name']
                  assert p.is_file(), f'missing artifact: {p}'
                  assert p.stat().st_size == artifact['size'], f'size mismatch: {p}'
                  assert component.get('version'), f'missing version: {component["id"]}'
          repo = json.loads(pathlib.Path('mgu-repo.json').read_text())
          app = next(c for c in repo['components'] if c['id'] == 'jap_ridetube')
          assert app['build']['python'] == 'kit/tools/build.py'
          assert app['build']['sdk'] == 'oap-sdk'
          assert app['build']['output'] == 'dist/{id}@{version}.tgz'
          required_shared = {'kit/runtime', 'kit/platform', 'kit/localization', 'kit/tools/build.py', 'kit/tools/pack_data.py', 'kit/tools/localize.py', 'kit/tools/locale-revisions.json', 'kit/tools/make_icon.js', 'kit/tools/oapgen', 'oap-sdk'}
          assert required_shared.issubset(set(app['build'].get('shared', []))), 'MGU source build is missing shared SDK/build inputs'
          assert pathlib.Path(app['path'], app['manifest']).is_file() if app.get('manifest') else pathlib.Path(app['path'], 'app.json').is_file()
          spec = json.loads(pathlib.Path('apps/jap_ridetube/app.json').read_text())
          assert spec.get('version'), 'RideTube app version is missing'
          assert any(item[1] == 'BTN_REMOTE' for item in spec['screens'][1]['items']), 'Phone remote entry missing from app source'
          assert app['requires']['jap-ridetube-d'] == components['jap-ridetube-d']['version']
          print('Catalog and MGU Store source OK:', ', '.join(sorted(components)), '+ jap_ridetube', spec['version'], '(built on the car)')
          PY

      - name: Publish MGU Store catalog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove both the previous release and its Git tag so the new tag
          # points at this exact source commit (not the old main commit).
          gh release delete catalog --yes --cleanup-tag || true
          gh release create catalog dist/release/* \
            --target "$GITHUB_SHA" \
            --title 'RideTube MGU Store catalog' \
            --notes 'MGU Store tools for RideTube. The RideTube app is built on the head unit from the repository branch via mgu-repo.json, using the BMW SDK donor already on the car. Includes the VLESS-enabled service, Node.js runtime and optional Full-width touch.'
